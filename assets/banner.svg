    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <g opacity="0.10" stroke="#ffffff" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280"/>
    <path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
  </g>

  <rect x="64" y="64" width="8" height="192" rx="4" fill="url(#accent)" filter="url(#glow)"/>

  <text x="104" y="130" fill="#f5f7fa" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="1">GRANNY: LEGACY</text>
  <text x="104" y="188" fill="#ff6b5e" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="6">SPEEDRUN MOD</text>
  <text x="106" y="238" fill="#9aa7b4" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="2">TIMER · SPLITS · SEEDS · CROSSHAIR · DEATH SOUND · ANTI-CHEAT</text>

  <g transform="translate(1046 72)" fill="none" stroke="#ff6b5e" stroke-width="8" stroke-linecap="round">
    <circle cx="76" cy="88" r="64"/>
    <path d="M76 48V88L104 106"/>
    <path d="M52 12H100"/>
    <path d="M76 12V28"/>
